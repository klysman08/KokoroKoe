[package]
name = "kokorokoe"
version = "0.1.0"
description = "Privacy-first local meeting transcription and assistance for Windows"
authors = ["KokoroKoe contributors"]
edition = "2024"
rust-version = "1.88"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kokorokoe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crossbeam-channel = "0.5.15"
earshot = "=1.2.1"
fs2 = "0.4"
rfd = { version = "0.17", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rubato = { version = "4.0.0", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
tempfile = "3"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_JobObjects",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"

[dev-dependencies]
junction = "2"
silero = "=0.6.0"
